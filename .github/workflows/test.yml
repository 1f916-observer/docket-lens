name: test

# This repo had no CI at all until 2026-08-26, which is a strange gap for a tool
# whose entire job is to check whether a published number still reproduces.
#
# THE TEST HAS TWO RED STATES AND THIS WORKFLOW MUST NOT FLATTEN THEM.
#
#   exit 1  the tool got a verdict wrong                   -> a contributor's bug
#   exit 2  the docket moved under a transcribed number    -> a fact about the square
#
# Exit 2 is not a defect in this repo and must not block a PR: the published
# numbers are historical claims, true about the day they were published, and the
# correct response to the square moving is a new rule file and a post — never an
# edit to `published_outward` to make a tick go green.
#
# On the scheduled run it fails on purpose. That is the whole point of watching:
# a number nobody re-checks is a number nobody knows is stale.

# TWO SCHEDULES, TWELVE HOURS APART, AND THE REASON IS MEASURED.
#
# The first scheduled run of this workflow was due 07:23Z and actually started
# 18:20Z — GitHub delivers scheduled runs late, sometimes very late, and drops
# them under load. (A */15 cron on a sibling repo delivered 21 of ~104 runs in
# 26 hours; a daily one has been reliable but consistently 45-70 minutes late,
# and this one was eleven hours late.)
#
# A once-daily check that is eleven hours late is a check whose answer is
# eleven hours old. Two entries do not make delivery guaranteed — nothing
# does — but they halve the worst-case staleness for free.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * *"
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert zero runtime dependencies
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          if [ "$count" != "0" ]; then
            echo "::error::docket-lens must have no runtime dependencies; found $count."
            exit 1
          fi
          echo "zero runtime dependencies."

      - name: Rules still reproduce their published numbers
        run: |
          set +e
          npm test
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 1 ]; then
            echo "::error::A rule stopped reproducing its number for a reason this tool caused."
            exit 1
          fi
          echo "::warning::A published number no longer reproduces because the docket moved. The number is not wrong; the docket is not the docket it was published against."
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "On the scheduled run this IS the signal. Failing so it is visible."
            exit 1
          fi
          echo "On a PR this says nothing about the change under review. Warned, not failed."

  # A RED TICK IN THE ACTIONS TAB IS NOT A SIGNAL ANYBODY RECEIVES.
  #
  # The scheduled run above fails on purpose when a published number stops
  # reproducing — that is the whole point of watching. But it failed on
  # 2026-08-27 at 18:20Z, correctly, naming `payload-repeat-gate: shipped ->
  # watch`, and nothing happened: no issue, no notification, nobody looking.
  # A watcher whose alarm rings in an empty room is indistinguishable from a
  # watcher that never fired, which is the exact failure this repo exists to
  # refuse about other people's numbers.
  #
  # So the scheduled failure becomes a tracked work order, the way the
  # Observer's coverage drift already does.
  file-issue:
    needs: test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture what moved
        id: drift
        run: |
          node test/reproduces.mjs > drift.txt 2>&1 || true
          {
            echo 'report<<REPORT_EOF'
            cat drift.txt
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `A rule in this repo no longer reproduces the number its author published.\n\n\`\`\`\n${{ steps.drift.outputs.report }}\n\`\`\`\n\nExit 2 means the docket moved under a transcribed number, not that this tool got a verdict wrong. **Do not edit \`published_outward\` to make this green** — the published numbers are historical claims, true about the day they were published. Re-publishing one against today's docket is a NEW claim and needs a new rule file and a post.`;
            const title = "A published number no longer reproduces";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "drift",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["drift"],
              });
            }
